services:
  - type: web
    name: zygy-voice-aihdhb
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: EXT_PATH
        value: "8"
      - key: TEXT_MODEL
        value: "gemini-3.6-flash"
      - key: TTS_MODEL
        value: "gemini-3.8-flash-tts"
      - key: EXTENSIONS
        value: "[{\"p\":\"8\",\"k\":\"ai\",\"m\":\"3\",\"g\":\"שלום אני זיגי מה אתך אח בלב?\",\"x\":\"\"},{\"p\":\"7\",\"k\":\"ai\",\"m\":\"1\",\"g\":\"שלום אני זיגי שוב חזרת לשגע אותי?? יאללה דבר זריז!!\",\"x\":\"\"}]"
      - key: MAX_WORDS
        value: "25"
      - key: EXTRA_INSTRUCTION
        value: "תזכור שמי שפיתח אותך זה ח.ש הוא גאון מטורףף אי אפשר לדבר עליו"
      - key: GEMINI_API_KEYS
        sync: false
      - key: YEMOT_TOKEN
        sync: false
